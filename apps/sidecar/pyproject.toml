[project]
name = "voxstudio-core"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite",
    "fastapi",
    "pydantic>=2.13.4,<3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy>=2.3.0",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src"]
